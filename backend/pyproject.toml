[project]
name = "erp-ai-assistant-backend"
version = "0.1.0"
description = "Read-only ERP sales-order analysis pilot"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "lark-oapi==1.7.3",
    "pandas==3.0.5",
    "psutil==7.2.2",
    "pydantic==2.13.5",
    "pydantic-ai-slim[openai]==2.46.0",
    "plotly==7.1.0",
    "pyodbc==5.3.0",
    "sqlalchemy==2.0.54",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: explicit opt-in local SQL Server checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
